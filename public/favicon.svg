  <!-- 前の札 -->
  <rect x="8" y="10" width="34" height="48" rx="6" fill="#fdf6e3" stroke="#8b5a2b" stroke-width="3" transform="rotate(-6 25 34)"/>
  <!-- 頭文字バッジ -->
